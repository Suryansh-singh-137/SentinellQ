services:

  postgres:
    image: postgres:17-alpine
    container_name: sentineliq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sentineliq
      POSTGRES_USER: sentineliq
      POSTGRES_PASSWORD: sentineliq_dev_password

    ports:
      - "5432:5432"

    volumes:
      - sentineliq_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sentineliq -d sentineliq"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: sentineliq-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - sentineliq_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:

  sentineliq_postgres_data:

  sentineliq_redis_data:
